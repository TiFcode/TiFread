<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>TiFread — Ritm de citit</title>
  <style>
    :root { --base:#fff; --fill:#111; --ink:#171717; --card:rgba(255,255,255,.92); }
    * { box-sizing:border-box; }
    html,body { margin:0; width:100%; height:100%; overflow:hidden; font-family:ui-rounded,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; color:var(--ink); }
    body { background:var(--base); }
    button,select,input { font:inherit; }
    #reading-space { position:fixed; inset:0; overflow:hidden; background:var(--base); }
    #fill { position:absolute; inset:0 0 auto 0; height:0%; background:var(--fill); transition:height .08s linear; }
    #base-pattern,#fill-pattern { position:absolute; inset:0; pointer-events:none; opacity:.22; }
    .pattern-dots { background-image:radial-gradient(currentColor 1.1px,transparent 1.1px); background-size:15px 15px; }
    .pattern-lines { background-image:repeating-linear-gradient(0deg,currentColor 0 1px,transparent 1px 11px); }
    .pattern-grid { background-image:linear-gradient(currentColor 1px,transparent 1px),linear-gradient(90deg,currentColor 1px,transparent 1px); background-size:22px 22px; }
    .pattern-diagonal { background-image:repeating-linear-gradient(135deg,currentColor 0 1px,transparent 1px 12px); }
    #base-pattern { color:var(--fill); } #fill-pattern { color:var(--base); }
    .topbar { position:fixed; z-index:5; inset:max(16px,env(safe-area-inset-top)) 16px auto; display:flex; align-items:center; justify-content:space-between; pointer-events:none; }
    .cluster { display:flex; gap:10px; pointer-events:auto; }
    .round { width:48px; height:48px; border:0; border-radius:50%; background:var(--card); color:var(--ink); display:grid; place-items:center; font-size:24px; cursor:pointer; box-shadow:0 7px 24px rgba(0,0,0,.12); backdrop-filter:blur(10px); -webkit-tap-highlight-color:transparent; }
    .round:active { transform:scale(.94); }
    .info { position:fixed; z-index:4; left:50%; bottom:max(22px,env(safe-area-inset-bottom)); transform:translateX(-50%); min-width:166px; padding:10px 16px; border-radius:999px; color:var(--ink); background:var(--card); box-shadow:0 7px 24px rgba(0,0,0,.12); text-align:center; font-weight:700; font-size:14px; letter-spacing:.02em; backdrop-filter:blur(10px); transition:opacity .25s; }
    #pause { position:fixed; z-index:5; left:50%; top:50%; transform:translate(-50%,-50%); width:74px; height:74px; border:0; border-radius:50%; font-size:26px; background:var(--card); color:var(--ink); box-shadow:0 9px 28px rgba(0,0,0,.15); cursor:pointer; opacity:0; transition:opacity .2s,transform .2s; }
    #reading-space:hover #pause, #pause:focus-visible, .paused #pause { opacity:1; } #pause:active { transform:translate(-50%,-50%) scale(.94); }
    .scrim { position:fixed; z-index:10; inset:0; background:rgba(0,0,0,.28); opacity:0; pointer-events:none; transition:opacity .24s; }
    .scrim.open { opacity:1; pointer-events:auto; }
    .drawer { position:fixed; z-index:11; top:0; bottom:0; left:0; width:min(310px,84vw); padding:max(26px,env(safe-area-inset-top)) 20px 24px; color:#1a1a1a; background:#fff; box-shadow:12px 0 32px rgba(0,0,0,.18); transform:translateX(-105%); transition:transform .26s ease; }
    .drawer.open { transform:translateX(0); } .brand { display:flex; align-items:center; gap:11px; margin:8px 0 31px; font-size:27px; font-weight:800; letter-spacing:-.04em; } .brand span { color:#635bff; }
    .menu-item { width:100%; display:flex; gap:15px; align-items:center; padding:15px 13px; border:0; border-radius:14px; color:#1b1b1b; background:transparent; text-align:left; font-weight:650; cursor:pointer; font-size:16px; } .menu-item:hover { background:#f1f0ff; } .menu-icon { font-size:22px; width:25px; text-align:center; }
    .drawer-note { position:absolute; left:32px; right:20px; bottom:max(24px,env(safe-area-inset-bottom)); color:#777; font-size:13px; line-height:1.45; }
    .modal { position:fixed; z-index:12; inset:0; display:grid; place-items:center; padding:18px; background:rgba(0,0,0,.33); opacity:0; pointer-events:none; transition:opacity .2s; } .modal.open { opacity:1; pointer-events:auto; }
    .panel { width:min(520px,100%); max-height:min(780px,calc(100dvh - 36px)); overflow:auto; padding:26px; border-radius:26px; background:#fff; box-shadow:0 18px 60px rgba(0,0,0,.26); transform:translateY(14px) scale(.98); transition:transform .2s; } .modal.open .panel { transform:none; }
    .panel-head { display:flex; align-items:center; justify-content:space-between; gap:14px; margin-bottom:23px; } .panel h2 { margin:0; font-size:25px; letter-spacing:-.03em; } .close { width:35px; height:35px; border:0; border-radius:50%; background:#f2f2f2; cursor:pointer; font-size:22px; }
    .field { margin:0 0 21px; } .field label,.section-label { display:block; margin-bottom:9px; font-size:14px; color:#555; font-weight:700; } .range-row { display:flex; align-items:center; gap:14px; } input[type=range] { width:100%; accent-color:#635bff; } output { min-width:64px; padding:7px 9px; border-radius:9px; text-align:center; background:#f1f0ff; color:#4338ca; font-weight:800; }
    select { width:100%; padding:11px 12px; border:1px solid #dedede; border-radius:11px; color:#222; background:#fff; } .toggle-row { display:flex; align-items:center; justify-content:space-between; gap:14px; padding:15px 0; border-top:1px solid #eee; } .toggle-row label { margin:0; color:#222; font-weight:750; } .switch { position:relative; width:51px; height:30px; flex:none; } .switch input { opacity:0; width:0; height:0; } .slider { position:absolute; inset:0; border-radius:999px; background:#d3d3d3; cursor:pointer; transition:.2s; } .slider:before { position:absolute; content:""; width:22px; height:22px; left:4px; bottom:4px; border-radius:50%; background:#fff; transition:.2s; box-shadow:0 1px 4px #888; } .switch input:checked + .slider { background:#635bff; } .switch input:checked + .slider:before { transform:translateX(21px); }
    .choices { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; } .choice { padding:11px 5px; border:1px solid #ddd; border-radius:11px; background:#fff; cursor:pointer; color:#333; font-size:14px; font-weight:700; } .choice.selected { border-color:#635bff; color:#4338ca; background:#f1f0ff; }
    .two-col { display:grid; grid-template-columns:1fr 1fr; gap:13px; } .swatch { display:flex; align-items:center; gap:9px; padding:8px 10px; border:1px solid #dedede; border-radius:11px; } input[type=color] { width:36px; height:30px; padding:0; border:0; background:transparent; cursor:pointer; } .save { width:100%; margin-top:4px; padding:14px; border:0; border-radius:13px; background:#635bff; color:#fff; font-weight:800; font-size:16px; cursor:pointer; box-shadow:0 5px 0 #4940c7; } .save:active { transform:translateY(3px); box-shadow:0 2px 0 #4940c7; }
    @media (max-width:420px) { .panel { padding:22px 18px; } .two-col { grid-template-columns:1fr; } .topbar { inset-left:12px; inset-right:12px; } }
  </style>
</head>
<body>
  <main id="reading-space" aria-label="Timer vizual pentru citit">
    <div id="base-pattern"></div><div id="fill"><div id="fill-pattern"></div></div>
    <header class="topbar"><div class="cluster"><button class="round" id="menu-btn" aria-label="Deschide meniul">☰</button></div><div class="cluster"><button class="round" id="settings-btn" aria-label="Setări">⚙</button></div></header>
    <button id="pause" aria-label="Pauză">Ⅱ</button><div class="info" id="info" aria-live="polite">01:00 · 0%</div>
  </main>
  <div id="scrim" class="scrim"></div>
  <aside id="drawer" class="drawer" aria-label="Meniu"><div class="brand">📖 <span>TiF</span>read</div><button class="menu-item" id="menu-reset"><span class="menu-icon">↻</span>Reîncepe intervalul</button><button class="menu-item" id="menu-pause"><span class="menu-icon">Ⅱ</span><span id="menu-pause-text">Pune pauză</span></button><button class="menu-item" id="menu-settings"><span class="menu-icon">⚙</span>Setări</button><p class="drawer-note">Un ritm liniștit de citit, fără numărătoare agresivă.</p></aside>
  <section id="settings-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="settings-title"><div class="panel"><div class="panel-head"><h2 id="settings-title">Setări</h2><button class="close" id="close-settings" aria-label="Închide">×</button></div>
    <div class="field"><label for="duration">Durata unui interval</label><div class="range-row"><input id="duration" type="range" min="15" max="300" step="5"><output id="duration-value"></output></div></div>
    <div class="toggle-row"><label for="beep-enabled">Bip periodic</label><label class="switch"><input id="beep-enabled" type="checkbox"><span class="slider"></span></label></div>
    <div class="field" id="beep-options"><span class="section-label">La fiecare parte din interval</span><div class="choices" id="beep-choice"><button class="choice" data-beep="0.25">1/4</button><button class="choice" data-beep="0.5">1/2</button><button class="choice" data-beep="1">1/1</button></div></div>
    <div class="two-col"><div class="field"><label for="base-color">Culoare inițială</label><div class="swatch"><input id="base-color" type="color"><span id="base-color-name"></span></div></div><div class="field"><label for="fill-color">Culoare de umplere</label><div class="swatch"><input id="fill-color" type="color"><span id="fill-color-name"></span></div></div></div>
    <div class="two-col"><div class="field"><label for="base-style">Pattern inițial</label><select id="base-style"><option value="solid">Simplu</option><option value="dots">Puncte</option><option value="lines">Linii</option><option value="grid">Grilă</option><option value="diagonal">Diagonal</option></select></div><div class="field"><label for="fill-style">Pattern de umplere</label><select id="fill-style"><option value="solid">Simplu</option><option value="dots">Puncte</option><option value="lines">Linii</option><option value="grid">Grilă</option><option value="diagonal">Diagonal</option></select></div></div>
    <button id="save-settings" class="save">Aplică setările</button>
  </div></section>
  <script>
    const defaults={duration:60,beep:false,beepPart:.25,base:'#ffffff',fill:'#111111',basePattern:'solid',fillPattern:'solid'};
    let settings={...defaults,...JSON.parse(localStorage.getItem('tifread-settings')||'{}')}; let startedAt=performance.now(), pausedAt=null, pauseElapsed=0, lastBeep=-1;
    const $=id=>document.getElementById(id), space=$('reading-space'), fill=$('fill'), info=$('info');
    function pattern(el,kind){ el.className=kind==='solid'?'':'pattern-'+kind; }
    function paint(){ document.documentElement.style.setProperty('--base',settings.base); document.documentElement.style.setProperty('--fill',settings.fill); $('base-color-name').textContent=settings.base.toUpperCase(); $('fill-color-name').textContent=settings.fill.toUpperCase(); pattern($('base-pattern'),settings.basePattern); pattern($('fill-pattern'),settings.fillPattern); document.querySelector('meta[name="theme-color"]').content=settings.base; }
    function displayTime(seconds){ const s=Math.max(0,Math.ceil(seconds)),m=Math.floor(s/60); return String(m).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); }
    function beep(){ try { const C=window.AudioContext||window.webkitAudioContext,ctx=new C(),osc=ctx.createOscillator(),gain=ctx.createGain(); osc.frequency.value=830; gain.gain.setValueAtTime(.055,ctx.currentTime); gain.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.11); osc.connect(gain).connect(ctx.destination); osc.start(); osc.stop(ctx.currentTime+.12); } catch(e){} }
    function reset(){ startedAt=performance.now(); pauseElapsed=0; pausedAt=null; lastBeep=-1; setPaused(false); }
    function setPaused(on){ if(on&&!pausedAt){pausedAt=performance.now()} if(!on&&pausedAt){pauseElapsed+=performance.now()-pausedAt;pausedAt=null} space.classList.toggle('paused',!!pausedAt); $('pause').textContent=pausedAt?'▶':'Ⅱ'; $('pause').setAttribute('aria-label',pausedAt?'Pornește':'Pauză'); $('menu-pause-text').textContent=pausedAt?'Pornește':'Pune pauză'; }
    function tick(now){ const elapsed=(pausedAt?pausedAt:now)-startedAt-pauseElapsed, duration=settings.duration*1000, cycle=elapsed%duration, progress=Math.max(0,cycle/duration); fill.style.height=(progress*100)+'%'; info.textContent=displayTime(settings.duration-cycle/1000)+' · '+Math.floor(progress*100)+'%'; if(settings.beep&&!pausedAt){ const part=settings.duration*settings.beepPart*1000,marker=Math.floor(elapsed/part); if(marker>lastBeep&&elapsed>250){beep();lastBeep=marker;} } requestAnimationFrame(tick); }
    function drawer(open){ $('drawer').classList.toggle('open',open); $('scrim').classList.toggle('open',open); }
    function modal(open){ $('settings-modal').classList.toggle('open',open); }
    function loadForm(){ $('duration').value=settings.duration; $('duration-value').textContent=settings.duration+' s'; $('beep-enabled').checked=settings.beep; $('base-color').value=settings.base; $('fill-color').value=settings.fill; $('base-style').value=settings.basePattern; $('fill-style').value=settings.fillPattern; document.querySelectorAll('[data-beep]').forEach(b=>b.classList.toggle('selected',+b.dataset.beep===settings.beepPart)); }
    $('menu-btn').onclick=()=>drawer(true); $('scrim').onclick=()=>drawer(false); $('settings-btn').onclick=()=>{loadForm();modal(true)}; $('close-settings').onclick=()=>modal(false); $('menu-settings').onclick=()=>{drawer(false);loadForm();modal(true)}; $('menu-reset').onclick=()=>{reset();drawer(false)}; $('menu-pause').onclick=()=>{setPaused(!pausedAt);drawer(false)}; $('pause').onclick=()=>setPaused(!pausedAt);
    $('duration').oninput=e=>$('duration-value').textContent=e.target.value+' s'; document.querySelectorAll('[data-beep]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-beep]').forEach(x=>x.classList.remove('selected'));b.classList.add('selected')});
    $('save-settings').onclick=()=>{settings.duration=+$('duration').value; settings.beep=$('beep-enabled').checked; settings.beepPart=+document.querySelector('[data-beep].selected').dataset.beep; settings.base=$('base-color').value; settings.fill=$('fill-color').value; settings.basePattern=$('base-style').value; settings.fillPattern=$('fill-style').value; localStorage.setItem('tifread-settings',JSON.stringify(settings)); paint();reset();modal(false)};
    document.addEventListener('keydown',e=>{if(e.key==='Escape'){drawer(false);modal(false)} if(e.key===' '&&!$('settings-modal').classList.contains('open')){e.preventDefault();setPaused(!pausedAt)}}); paint();loadForm();requestAnimationFrame(tick);
  </script>
</body>
</html>
